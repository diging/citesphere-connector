name: github-actions
on: [ push, pull_request ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5

      - run: pip install -r requirements.txt
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5

      - run: pip install -r requirements.txt
      - run: python -m unittest tests/CitesphereConnectorTest.py
  ruff:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: astral-sh/ruff-action@v3

      - run: ruff check --fix
      - run: ruff format
